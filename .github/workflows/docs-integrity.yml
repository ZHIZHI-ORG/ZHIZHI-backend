name: Documentation integrity

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'api/api/**'
      - 'api/src/**'
      - 'api/scripts/verify-docs.js'
      - 'api/tests/**'
      - 'api/package.json'
      - 'api/package-lock.json'
      - 'supabase/**'
      - '.github/workflows/docs-integrity.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - '**/*.md'
      - 'api/api/**'
      - 'api/src/**'
      - 'api/scripts/verify-docs.js'
      - 'api/tests/**'
      - 'api/package.json'
      - 'api/package-lock.json'
      - 'supabase/**'
      - '.github/workflows/docs-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run test:docs
      - run: npm run type-check
      - run: npm run test:auth-infra
      - run: npm run test:invite
      - run: npm run test:bazi-basic-info
      - run: npm run test:true-solar-time
      - run: npm run test:wuxing
      - run: npm run test:shensha
      - run: npm run test:mingli-ai-context
      - run: npm run test:patterns
      - run: npm run test:ziping-facts
      - run: npm run test:mingli-interactions
      - run: npm run test:history
      - run: npm run test:commerce
